<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Windows: the hidden cord hazard</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Cordless blinds and shades</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Preferred where young children are present</text><text x="60" y="210" font-size="18">Tying a cord higher</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Not a safety method</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Crib and furniture placement</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Keep furniture and cribs away from windows</text><text x="60" y="306" font-size="18">Continuous-loop and inner cords</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Inner cords, loops, drapery pulls, chains</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Window access</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Falls as well as strangulation</text></svg>