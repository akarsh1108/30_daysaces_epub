<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">When not to use adhesive</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Furniture</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Unstable furniture</text><text x="60" y="210" font-size="18">Shelves</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Loose or climbable shelves</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Tip-over</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Anything that can tip</text><text x="60" y="306" font-size="18">Bad surface</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Damaged, peeling, dusty, greasy, raw, or unknown paint</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Injury if it fails</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Failure could cause serious injury</text><text x="60" y="402" font-size="18">Maker requires screws</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">The maker requires a mechanical anchor</text></svg>