<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Age bands change the hazard</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">About 0 to 12 months</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Reach, grab, mouth, crib and window-covering cords</text><text x="60" y="210" font-size="18">About 1 to 3 years</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Climb, pull, open drawers, reach higher, use a drawer as a step</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">About 3 to 5 years</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">More sophisticated climbing, latches, previously high objects</text></svg>