<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Electrical at child height</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Outlets</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Cover or block accessible outlets per the product</text><text x="60" y="210" font-size="18">Power strips</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Rated strips; do not overload with heat tools</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Extension cords</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Avoid as a permanent child-area solution</text><text x="60" y="306" font-size="18">Cables</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">No crush, no trap, no sharp bend</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Night lights and chargers</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Inspect; follow maker clearance and heat limits</text><text x="60" y="402" font-size="18">Monitors and lamps</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Loops are pull toys</text></svg>