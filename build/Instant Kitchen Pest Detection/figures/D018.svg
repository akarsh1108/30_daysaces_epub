<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">New food entering the kitchen</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Inspect packaging</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Before it shelves</text><text x="60" y="210" font-size="18">Check seams and folds</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Favorite moth hiding places</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Damaged wrap or webbing</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Holes, gnaws, silk</text><text x="60" y="306" font-size="18">Store susceptible dry goods</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Sealed, dry, pest-tight if you can</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Do not mix with established stock</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Quarantine first</text><text x="60" y="402" font-size="18">Record suspected source</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Store, trip, or gift — write it down</text></svg>