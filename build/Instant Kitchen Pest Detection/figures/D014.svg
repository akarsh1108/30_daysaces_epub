<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Sensor failure and false alerts</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Low battery</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Dead or dying power</text><text x="60" y="210" font-size="18">Wi-Fi loss</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Dropped events</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Camera obstruction or dust</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">No picture, still alerting</text><text x="60" y="306" font-size="18">Humidity sensor drift</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Drift, not a leak</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Pets</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Motion that is not a pest</text><text x="60" y="402" font-size="18">HVAC airflow, shadows, light shifts</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Air and light copying motion</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Missed notifications</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">You never saw the ping</text><text x="60" y="498" font-size="18">Physical verification</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">Required before treatment</text></svg>