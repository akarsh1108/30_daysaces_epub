<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">When food leaves the kitchen</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Sealed, unopened, undamaged pack</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Keep if intact; still inspect</text><text x="60" y="210" font-size="18">Open food exposed to insects</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Usually discard; clean the zone</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Packaging with holes or gnaw marks</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Do not use the contents</text><text x="60" y="306" font-size="18">Food with droppings or urine</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Do not salvage; escalate cleanup</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Pantry goods with suspected infestation</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Isolate; follow food-safety guidance</text><text x="60" y="402" font-size="18">Refrigerated food exposed to pests</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">If pests reached it, do not guess</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Food-contact surfaces</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">Clean before any food returns</text></svg>