<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Calibrate every threshold</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Pest species</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Ants are not rodents</text><text x="60" y="210" font-size="18">Kitchen size</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">A studio is not a canteen</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Baseline activity</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">What &#x27;normal&#x27; already was</text><text x="60" y="306" font-size="18">Trap type</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Glue, pheromone, and snap are not equal</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Trap placement</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">An edge catch is not a counter catch</text><text x="60" y="402" font-size="18">Season</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Warm weeks change pressure</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Severity</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">One scout is not a nest</text><text x="60" y="498" font-size="18">Residential vs food-service</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">Ho