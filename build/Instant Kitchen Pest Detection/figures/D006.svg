<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Child and pet safety</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Traps and bait</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Out of reach and locked if the product says so</text><text x="60" y="210" font-size="18">Food and water bowls</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Never next to bowls</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Cords and sensor hardware</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Tape or route them out of traffic</text><text x="60" y="306" font-size="18">Exposed traps</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Not in walking lines or under toddler hands</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Pet and child exposure</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">The label, not a kitchen myth</text><text x="60" y="402" font-size="18">If exposure happens</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Label plus medical or veterinary help</text></svg>