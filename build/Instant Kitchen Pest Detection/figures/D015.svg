<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Things that can look like pest evidence</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Food crumbs</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Not always droppings</text><text x="60" y="210" font-size="18">Coffee or pepper particles</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Not always frass</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Grease marks</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Not always a run</text><text x="60" y="306" font-size="18">Condensation</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Not always a leak from pests</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Dust and small fibers</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Not always webbing</text><text x="60" y="402" font-size="18">Drain residue or appliance debris</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Not always a nest</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Normal insects outside the kitchen</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">Not always infestation indoors</text><text x="60" y="498" font-size="18">Rule before escalating</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">Need a second sign, unless high-risk</text></svg>