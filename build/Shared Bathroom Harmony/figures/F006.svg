<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Stop and escalate</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Outlets and wiring</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Do not open outlets or rewire</text><text x="60" y="210" font-size="18">GFCI and protection</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Depends on install and local rules</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Faults or missing protection</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Call a qualified electrician</text><text x="60" y="306" font-size="18">Uncertain condition</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Stop until a professional advises</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">This book&#x27;s storage ideas</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Manufacturer and local rules win</text></svg>