<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Heat map is not a safety stamp</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Likelihood 1 to 5</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Rare to expected</text><text x="60" y="210" font-size="18">Impact 1 to 5</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Nuisance to injury or legal stop</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Cost vs safety</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Do not mix into one cell</text><text x="60" y="306" font-size="18">Owner and due date</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Name and date</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Yellow or red move</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Add control and date</text><text x="60" y="402" font-size="18">High-severity hazard</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Restrict and refer</text></svg>