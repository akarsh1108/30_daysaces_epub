<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">What these tests do not prove</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">A temperature target</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Not a DIY heater adjustment</text><text x="60" y="210" font-size="18">A plug-in tester</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Not a full inspection</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Air at the grille</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Not duct or code performance</text><text x="60" y="306" font-size="18">Kitchen vs bath fan</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Not the same system</text></svg>