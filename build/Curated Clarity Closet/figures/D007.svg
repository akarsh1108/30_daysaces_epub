<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Climate jobs — pick yours</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Humidity</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Longer dry time; no sealed damp</text><text x="60" y="210" font-size="18">Rain</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Dedicated wet-weather pair</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Sweat and odor</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Wash or air by odor, not a count</text><text x="60" y="306" font-size="18">Dust</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Colors and fibers that you can keep</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Mild winter</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Layers you will actually wear</text><text x="60" y="402" font-size="18">Long storage</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Clean, dry, labeled, inspect later</text></svg>