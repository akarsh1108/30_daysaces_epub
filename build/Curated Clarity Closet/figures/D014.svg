<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Footwear-care checklist</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Dry wet shoes</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Before they go away</text><text x="60" y="210" font-size="18">Rotate frequent pairs</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Let frequent pairs air</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Leather, suede, fabric, synthetic</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Each material, that product&#x27;s method</text><text x="60" y="306" font-size="18">Sole wear and damage</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Soles, grip, structure</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Repair vs ready</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Repair pile vs ready pile</text><text x="60" y="402" font-size="18">Unsafe or painful damage</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Do not wear them</text></svg>