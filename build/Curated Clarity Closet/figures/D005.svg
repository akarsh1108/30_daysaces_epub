<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Color without a mandatory undertone</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Skip undertone</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Allowed</text><text x="60" y="210" font-size="18">Vein or sheet test</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Starting point only</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Wear test</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Near the face, two lights</text><text x="60" y="306" font-size="18">Existing wardrobe</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Against clothes you own</text></svg>