<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">How to score 1 versus 5</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Fit and comfort</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Unwearable vs all-day comfort</text><text x="60" y="210" font-size="18">Fabric and care</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Impossible care vs label you follow</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Function for the day</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Fails the day vs does the job</text><text x="60" y="306" font-size="18">Style alignment</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">You will not wear vs you reach for it</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Versatility</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">One forced look vs several equations</text><text x="60" y="402" font-size="18">Weighting</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Add them if useful; equal weight</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Minimum Keep total</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">None that beats a veto</text><text x="60" y="498" font-size="18">High score plus discomfort</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">Tailor, Test, or Exit anyway</text></svg>