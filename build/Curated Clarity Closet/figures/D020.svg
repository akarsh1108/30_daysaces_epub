<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Footwear fields in the same audit</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Primary use</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Work, commute, home, occasion</text><text x="60" y="210" font-size="18">Walking or standing comfort</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Walk and stand in them</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Weather suitability</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Rain, heat, indoor only</text><text x="60" y="306" font-size="18">Soles and fasteners</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Soles, grip, straps, zips</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Dry and clean requirements</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">From the maker, not a generic wipe</text><text x="60" y="402" font-size="18">Repairable</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Yes / no / unknown</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Works with actual outfits</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">Name two real outfits or none</text></svg>