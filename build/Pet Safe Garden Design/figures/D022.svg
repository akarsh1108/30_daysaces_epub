<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Irrigation safety pass</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Backflow prevention</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">If relevant to the bib</text><text x="60" y="210" font-size="18">Leak detection</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Look and fix</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Hose and tubing inspection</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">On a schedule</text><text x="60" y="306" font-size="18">Electrical separation</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Qualified install if new circuits</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Standing water</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">No mosquito puddles</text><text x="60" y="402" font-size="18">Chew or tangle points</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Move the line</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Drinking water</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">A bowl you can clean</text><text x="60" y="498" font-size="18">Drip under mulch</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">Not solved by hiding it</text></svg>