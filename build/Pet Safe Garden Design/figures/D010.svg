<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Two drainage worlds</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Ground — French drain</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Need outlet, upkeep, permission</text><text x="60" y="210" font-size="18">Ground — discharge</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Not toward buildings or neighbors</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Ground — local conditions</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Assess soil; a level is not a design</text><text x="60" y="306" font-size="18">Balcony — excavation</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Do not regrade or bury drains</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Balcony — outlets</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Do not block outlets</text><text x="60" y="402" font-size="18">Balcony — waterproofing</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Confirm before any water change</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Balcony — runoff</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">No damage to walls or below</text><text x="60" y="498" font-size="18">Balcony — containers</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">Containers if the space allows</text></svg>