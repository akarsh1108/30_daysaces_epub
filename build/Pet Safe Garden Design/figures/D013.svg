<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Catio do-not-proceed</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Uncertain balcony load</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Use wall or skip</text><text x="60" y="210" font-size="18">Mesh too open</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Size to the smallest pet</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Attachments and latches</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Engineered, permitted, inspected</text><text x="60" y="306" font-size="18">Wet carpet or mold</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Inspect and replace</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Shelf depth alone</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Not a safety rating</text></svg>