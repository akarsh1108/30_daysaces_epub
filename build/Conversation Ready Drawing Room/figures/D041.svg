<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Weekly reset checks</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Main walkway clear</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Thirty to thirty-six inches on the everyday path</text><text x="60" y="210" font-size="18">Seat sees a seat</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Every seat sees at least one other</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">No drift</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Feet still on the marks</text><text x="60" y="306" font-size="18">Rug safe</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Corners flat, edge off the main route</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Serving surfaces clear</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Not a second cupboard</text><text x="60" y="402" font-size="18">Cords</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">No trip lines</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Entry path</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">Door to first seat is obvious</text></svg>