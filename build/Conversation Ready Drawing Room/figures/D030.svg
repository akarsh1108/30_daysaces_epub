<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Measurement language used in this book</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Seat-to-seat distance</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Front edge of one seat to the front edge of the other</text><text x="60" y="210" font-size="18">Conversation-zone diameter</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Overall diameter of the social cluster</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Walkway clearance</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Clear floor between furniture edges</text><text x="60" y="306" font-size="18">Seat rotation</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">How far a chair turns from its wall-facing start</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Conversation angle</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Angle between the viewing directions of two seats</text><text x="60" y="402" font-size="18">Coffee-table reach</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Seat front edge to coffee-table edge</text></svg>