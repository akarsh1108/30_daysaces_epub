<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Which system to use, in order</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">1. Safety and circulation</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Walkways, pinch points, cords, trip edges, mobility needs</text><text x="60" y="210" font-size="18">2. Seating relationship</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Seat-to-seat, rotation, conversation angle, zone diameter</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">3. Focal point</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Primary / secondary focal, then the social anchor</text><text x="60" y="306" font-size="18">4. Lighting and acoustics</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Ambient, task, social, accent; clap test</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">5. Hosting scenarios</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Everyday, movie, hosting, cleaning</text><text x="60" y="402" font-size="18">6. Styling</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">After the room works</text></svg>