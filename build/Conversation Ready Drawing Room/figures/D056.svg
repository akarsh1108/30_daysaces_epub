<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Planning ranges (starting points)</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Intimate zone diameter</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">About six to eight feet</text><text x="60" y="210" font-size="18">Casual zone diameter</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">About eight to twelve feet</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Pairs, seat-to-seat</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Thirty to forty-eight inches</text><text x="60" y="306" font-size="18">Trios, seat-to-seat</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Thirty-six to fifty-four inches</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Group circles, seat-to-seat</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Sixty to eighty-four inches</text><text x="60" y="402" font-size="18">Everyday walkway</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Thirty-six inches preferred; thirty compact</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Pinch point</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">Twenty-four to thirty, short pinch only</text><text x="60" y="498" font-size="18">Seat rotation</text><text x="