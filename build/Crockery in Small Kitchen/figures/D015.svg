<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Crockery safety</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Adhesive and hangers</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Surface, humidity, direction, then a light test</text><text x="60" y="210" font-size="18">Under-shelf mug rails</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Not a mug graveyard</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Heavy stacks</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Low</text><text x="60" y="306" font-size="18">Unstable plates</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Divider or don&#x27;t stack</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Children and glass</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Out of climb and throw range</text><text x="60" y="402" font-size="18">Wet liners and thermal shock</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Dry liners; no fridge-to-oven</text></svg>