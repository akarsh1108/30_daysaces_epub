<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">The 6-Fit Test</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Use fit</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Do I actually use it</text><text x="60" y="210" font-size="18">Quantity fit</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Do I need this many</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Size fit</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Does it fit the usable opening</text><text x="60" y="306" font-size="18">Stack fit</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Does it stack safely</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Care fit</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Can I wash, heat, and dry it as I live</text><text x="60" y="402" font-size="18">Style fit</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Does it work with the rest</text></svg>