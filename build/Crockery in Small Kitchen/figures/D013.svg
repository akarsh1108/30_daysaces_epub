<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Example 3–4 person Indian daily set</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Dinner plates</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Six if one wash; four if two</text><text x="60" y="210" font-size="18">Katoris or bowls</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Same as plates for thali</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Chai mugs</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Tea cycles, not dinner only</text><text x="60" y="306" font-size="18">Glasses</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Water with meals</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Serving bowls</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Two, secondary if huge</text><text x="60" y="402" font-size="18">Guest pieces</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Not on the daily shelf</text></svg>