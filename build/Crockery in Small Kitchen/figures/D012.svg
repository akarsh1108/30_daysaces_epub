<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Material starting points</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Porcelain</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Light–medium; stacks well; heat per label</text><text x="60" y="210" font-size="18">Stoneware</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Heavier; good stacks; heat per label</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Tempered glass</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Light; stacks well; heat per label</text><text x="60" y="306" font-size="18">Melamine</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Light; tough; usually not microwave</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Stainless steel</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Not microwave; daily Indian use</text><text x="60" y="402" font-size="18">Oven, freezer, metallic rim</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Verify every icon on the foot</text></svg>