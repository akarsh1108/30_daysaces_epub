<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Before you buy crockery</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Measure</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Usable opening, not the box</text><text x="60" y="210" font-size="18">Quantity</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">From wash-cycle math</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Max diameter and height</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Must clear the shelf</text><text x="60" y="306" font-size="18">Material</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">One family</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Stackability</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">With what you own</text><text x="60" y="402" font-size="18">Replacement / open stock</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Can you buy one plate later</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Heat and wash icons</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">The foot icons</text><text x="60" y="498" font-size="18">Weight and rim</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">Lift it in the shop</text></svg>