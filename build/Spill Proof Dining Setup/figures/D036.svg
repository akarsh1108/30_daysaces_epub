<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Table-to-torso is not a 3–5 inch rule</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">3–5 in (do not require)</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">not mandatory</text><text x="60" y="210" font-size="18">Abdomen and breath</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">check breathing</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Knees and armrests</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">check wheelchair</text></svg>