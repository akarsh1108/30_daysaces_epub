<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">When to leave the balcony</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Storms</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Lightning or thunderstorm</text><text x="60" y="210" font-size="18">Wind</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Severe wind; objects acting as sails</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Water underfoot</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Flooding, blocked drains, slippery floor</text><text x="60" y="306" font-size="18">Structure</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Damaged railing, cracks, falling debris</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Electrics and fire</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Electrical gear in water; smoke or fire nearby</text><text x="60" y="402" font-size="18">Loose gear or heat</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Loose screens or planters; extreme heat</text></svg>