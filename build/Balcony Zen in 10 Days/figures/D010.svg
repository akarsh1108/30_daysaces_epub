<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">The balcony cycle</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Audit</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Measure, documents, drains, railing, egress</text><text x="60" y="210" font-size="18">Design</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Zones, privacy trade-offs, plant and seat sketch</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Test</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Wind, load, wet floor, stop-use</text><text x="60" y="306" font-size="18">Install</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Only what passed the tests</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Live</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Sit, then leave when conditions fail</text><text x="60" y="402" font-size="18">Maintain</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">4</text></svg>