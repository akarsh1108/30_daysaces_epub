<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Wind-safe is not the same as heavy</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Large vertical face, can topple or fly</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Remove it in strong wind rather than adding more weight</text><text x="60" y="210" font-size="18">Privacy layers</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Bamboo, lattice, curtains, umbrellas, hanging decor</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Loose comfort</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Lightweight furniture, cushions, mats</text><text x="60" y="306" font-size="18">Rods</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Tension rods: maker&#x27;s use only, not a barrier, not a fall restraint</text></svg>