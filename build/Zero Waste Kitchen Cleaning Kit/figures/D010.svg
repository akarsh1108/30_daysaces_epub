<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Your complete tiny-kitchen cleaning kit</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Microfiber cloths (4)</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Counters, daily wipe; retire if odor or fray</text><text x="60" y="210" font-size="18">Glass/polish cloths (2)</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Glass and stainless; lint-free</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Soft brush (1)</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Seams and details; retire worn bristles</text><text x="60" y="306" font-size="18">Squeegee (1)</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Glass and suitable splashbacks</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Refillable bottles (3)</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">One job per bottle, labelled</text><text x="60" y="402" font-size="18">Gloves</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">As needed; retire if torn</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Scraper (1)</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">Stuck residue on compatible surfaces</text><text x="60" y="498" font-size="18">Raw-meat cloth set</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">Never mix with everyday cloths</text></svg>