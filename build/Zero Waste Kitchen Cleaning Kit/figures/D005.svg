<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Compatibility and limitations</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">White vinegar</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Mineral film on compatible hard surfaces; never stone</text><text x="60" y="210" font-size="18">Castile soap</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Everyday grease and soil; rinse food-contact</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Baking soda</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Mild scrub where the finish can take it</text><text x="60" y="306" font-size="18">Citric acid</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Scale on compatible surfaces; not stone</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Hydrogen peroxide</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Only uses printed on that bottle&#x27;s label</text><text x="60" y="402" font-size="18">Alcohol (70%)</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Only manufacturer-approved hard surfaces</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Essential oils</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">Optional scent only; skip for pets/sensitive users</text></svg>