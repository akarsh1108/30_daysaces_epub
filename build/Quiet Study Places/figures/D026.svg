<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Cores compared, none universally best</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Mineral wool</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Absorption; enclose and handle with care</text><text x="60" y="210" font-size="18">Fiberglass board</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Framed boards; follow that product SDS</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">PET felt</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Easier handling; thickness and build matter</text><text x="60" y="306" font-size="18">Wood slats</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Visual only unless backed as specified</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Fabric</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Wrap and look; fire and cleaning docs</text><text x="60" y="402" font-size="18">Foam</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Only with documented fire and use</text></svg>