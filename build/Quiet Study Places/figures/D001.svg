<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">What panels can and cannot do</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Echo in the room</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Absorbers, rugs, curtains — not silence</text><text x="60" y="210" font-size="18">Harsh voice reflections</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">First-reflection treatment — not total elimination</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Traffic or neighbour noise</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Seals, layout, masking — not panels alone</text><text x="60" y="306" font-size="18">Sound leaving the room</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Sealing and construction — not decorative panels</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Intermittent distraction</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Masking, headphones, schedule — not removing the source</text></svg>