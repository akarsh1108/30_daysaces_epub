<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Ceiling-cloud do-not-proceed</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Uncertain ceiling</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Use wall or freestanding</text><text x="60" y="210" font-size="18">Heavy panel overhead</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Not adhesive or improvised hooks</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Fans, lights, detectors</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Keep them clear</text><text x="60" y="306" font-size="18">Maintenance access</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Do not block access</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Above bed or chair</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Needs engineered support</text><text x="60" y="402" font-size="18">Structural anchoring</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Use qualified installation</text></svg>