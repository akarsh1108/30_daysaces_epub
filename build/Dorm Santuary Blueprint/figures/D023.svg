<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Symptom to next move</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Light on the pillow</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Angle, then screen, then mask</text><text x="60" y="210" font-size="18">Hallway noise</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Gap, then low mask, then talk</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Feels exposed</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Turn the bed, then a side layer</text><text x="60" y="306" font-size="18">Feels cluttered</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Reset, then cables</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Feels hot</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Open the cocoon, keep airflow</text><text x="60" y="402" font-size="18">Almost no floor</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Bed, path, light, noise</text></svg>