<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Shopping matrix — what and why</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Tension rod</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Privacy; High; rack if rods banned</text><text x="60" y="210" font-size="18">Curtain panel</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Light/privacy; High; extra sheet on allowed rod</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Felt pads</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Noise of chairs; Medium; folded cloth</text><text x="60" y="306" font-size="18">Cable clips or wraps</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Tidy; Medium; tuck under mattress</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Draft stopper</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Hall gap; Medium; earplugs if banned</text><text x="60" y="402" font-size="18">Clip-on warm lamp</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Evening light; High; use the desk lamp you have</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Rug runner</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">Footfall; Medium; skip if no floor</text><text x="60" y="498" font-size="18">Eye mask and earplugs</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">Mask and plugs; High; on Starter always</text></svg>