<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Type B — square shared room</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Door</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Two entries or one — keep swing free</text><text x="60" y="210" font-size="18">Traffic path</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Not through either pillow</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Beds</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Adjacent walls, heads inward or away from door</text><text x="60" y="306" font-size="18">Desks</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Opposite corners</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Screen</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Low, if allowed</text><text x="60" y="402" font-size="18">Window</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Share or split glare</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Privacy layer</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">A cue, not a wall</text></svg>