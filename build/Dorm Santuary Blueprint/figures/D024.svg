<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Do not buy these first</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Studio acoustic panels</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">They do not soundproof a hall</text><text x="60" y="210" font-size="18">Elaborate bed tents</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Fire and heat risk</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Oversized furniture</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">No floor left</text><text x="60" y="306" font-size="18">Extra decorative lighting</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Glare and clutter</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Bulky screens</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">They become a sail and a trip</text><text x="60" y="402" font-size="18">Strong fragrance products</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Asthma and roommate veto</text></svg>