<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Pet terrace safety</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Toxic plants</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Out of reach or not planted</text><text x="60" y="210" font-size="18">Escape gaps</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Sphere and latch still matter</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Climbable furniture at guards</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Not against the rail</text><text x="60" y="306" font-size="18">Loose strings and cables</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Tie or remove</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Chemicals and fertilizers</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Locked away</text><text x="60" y="402" font-size="18">Hot surfaces in sun</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Paws and pads burn</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Shade and water</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">A bowl and a shaded pad</text><text x="60" y="498" font-size="18">Barrier vs pet size and behavior</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">A cat is not a toddler</text></svg>