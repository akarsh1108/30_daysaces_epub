<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">When severe weather is expected</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Remove loose objects</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Now</text><text x="60" y="210" font-size="18">Secure furniture</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Now</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Close or remove umbrellas</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Now</text><text x="60" y="306" font-size="18">Check drainage</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Now</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Disconnect portable electrical kit</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Now</text><text x="60" y="402" font-size="18">Children and pets</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Inside</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Reinspect after</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">Do not skip</text></svg>