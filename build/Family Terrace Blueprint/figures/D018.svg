<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Terrace water-management checklist</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Identify every drain</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Map them</text><text x="60" y="210" font-size="18">Keep drains accessible</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Nothing parked on the grate</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Slope toward drains</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Water should not pond mid-slab</text><text x="60" y="306" font-size="18">Furniture and planters off the path</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Lift them before rain</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Standing water after rainfall</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Photograph and time it</text><text x="60" y="402" font-size="18">Door thresholds</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Water should not run indoors</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Planter drainage</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">Overflow is a slip and a leak</text><text x="60" y="498" font-size="18">Dampness below; do not seal the drain</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">Not a caulk job</text></svg>