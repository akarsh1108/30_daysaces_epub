<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Wind-event checklist</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Umbrellas</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Down or inside</text><text x="60" y="210" font-size="18">Lightweight furniture</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Move or tie as the maker allows</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Tall planters</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Wet soil still blows over</text><text x="60" y="306" font-size="18">Loose décor</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">It becomes a missile</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Screens and panels</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">They are sails</text><text x="60" y="402" font-size="18">Furniture weight as an anchor</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Not a substitute for rated hardware</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Manufacturer anchoring</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">The label wins</text></svg>