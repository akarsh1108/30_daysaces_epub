<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Before you modify a terrace</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Freestanding furniture and removable mats</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Usually yes</text><text x="60" y="210" font-size="18">Portable shade and removable storage</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Usually yes</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Planters where permitted</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">If the lease and society allow</text><text x="60" y="306" font-size="18">Non-permanent child barriers</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Usually yes</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Documenting drains and cracks</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Usually yes</text><text x="60" y="402" font-size="18">Temporary barriers</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">If it does not become a climbable ladder</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Drilling, anchoring, permanent screens</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">Written approval</text><text x="60" y="498" font-size="18">Flooring, electrical, drains, waterproofing, str</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">Written approval plus a professional</text></svg>