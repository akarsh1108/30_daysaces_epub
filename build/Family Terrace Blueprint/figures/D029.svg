<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Planter safety</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Weight when soil is wet</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Heavier than it looks</text><text x="60" y="210" font-size="18">Wind exposure</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Can topple or sail</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Drainage</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Must reach a drain, not a path</text><text x="60" y="306" font-size="18">Overflow</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Not a pool at the door</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Stability</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Will not roll or tip easily</text><text x="60" y="402" font-size="18">Position relative to guards</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Not a ladder at the edge</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Toxic plants</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">If pets can reach them</text></svg>