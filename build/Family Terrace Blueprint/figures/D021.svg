<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Waterproofing is not crack paint</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Visible crack vs failed membrane</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Different problem</text><text x="60" y="210" font-size="18">Casual drilling</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Can void a system</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Planters and furniture on the layer</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Feet and wet pots punch through</text><text x="60" y="306" font-size="18">Persistent dampness below</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Investigate; do not perfume</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Specified to this building</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Match the existing build-up</text><text x="60" y="402" font-size="18">Invasive waterproofing</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Authorization plus a professional</text></svg>