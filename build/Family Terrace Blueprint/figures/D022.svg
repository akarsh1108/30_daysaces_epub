<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#111111"><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700">Terrace electrical safety</text><rect x="40" y="78" width="820" height="44" fill="#1E5F6B"/><text x="60" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Parameter</text><text x="560" y="110" font-size="19" fill="#FFFFFF" font-weight="700">Value</text><rect x="40" y="132" width="820" height="48" fill="#E8EFF0"/><text x="60" y="162" font-size="18">Outdoor-rated equipment</text><text x="560" y="162" font-size="18" fill="#111111" font-weight="600">Listed for outdoor use</text><text x="60" y="210" font-size="18">Weather protection</text><text x="560" y="210" font-size="18" fill="#111111" font-weight="600">Covers and placements the maker allows</text><rect x="40" y="228" width="820" height="48" fill="#E8EFF0"/><text x="60" y="258" font-size="18">Water ingress</text><text x="560" y="258" font-size="18" fill="#111111" font-weight="600">Not a soaked junction</text><text x="60" y="306" font-size="18">Cable routing</text><text x="560" y="306" font-size="18" fill="#111111" font-weight="600">Tied up, not a trip line</text><rect x="40" y="324" width="820" height="48" fill="#E8EFF0"/><text x="60" y="354" font-size="18">Improvised extension cords</text><text x="560" y="354" font-size="18" fill="#111111" font-weight="600">Not a daisy chain across the slab</text><text x="60" y="402" font-size="18">Permanent electrical work</text><text x="560" y="402" font-size="18" fill="#111111" font-weight="600">Not a weekend DIY</text><rect x="40" y="420" width="820" height="48" fill="#E8EFF0"/><text x="60" y="450" font-size="18">Protection devices</text><text x="560" y="450" font-size="18" fill="#111111" font-weight="600">Whatever local rules require</text><text x="60" y="498" font-size="18">Connections near standing water</text><text x="560" y="498" font-size="18" fill="#111111" font-weight="600">Move or disconnect portable kit</text></svg>