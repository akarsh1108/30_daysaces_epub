[project]
name = "bookkit"
version = "0.1.0"
description = "Page-anchored revision worklists for illustrated non-fiction"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]

[project.scripts]
bookkit = "bookkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
